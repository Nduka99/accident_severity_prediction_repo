name: Keep Backend Alive

on:
  schedule:
    # Run every 14 minutes (Render sleeps after 15 mins of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          # Use the backend URL found in previous logs
          curl -I https://accident-backend-vmbk.onrender.com/health
          echo "Ping sent to Backend"
